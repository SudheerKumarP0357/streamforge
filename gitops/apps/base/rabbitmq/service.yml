# --------- Service : RabbitMQ (Headless) ---------
apiVersion: v1
kind: Service
metadata:
  name: sf-rabbitmq-svc
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/component: queue
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  selector:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/component: queue
  ports:
    - port: 5672
      targetPort: 5672
      name: amqp
  clusterIP: None
