apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sf-infra-dev
  namespace: argocd
  labels:
    name: infra-dev
    project: streamforge
    env: dev
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: streamforge
  source:
    repoURL: https://github.com/SudheerKumarP0357/streamforge.git
    targetRevision: HEAD
    path: gitops/infra/envs/dev

  destination:
    server: https://kubernetes.default.svc
    namespace: streamforge-dev

  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - RespectIgnoreDifferences=true
      - ApplyOutOfSyncOnly=true
      - SkipDryRunOnMissingResource=true
  revisionHistoryLimit: 10
