apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sf-apps-dev
  namespace: argocd
  labels:
    name: apps-dev
    project: streamforge
    env: dev
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: streamforge
  source:
    repoURL: https://github.com/SudheerKumarP0357/streamforge.git
    targetRevision: HEAD
    path: gitops/apps/envs/dev

  destination:
    server: https://kubernetes.default.svc
    namespace: streamforge-dev

  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - RespectIgnoreDifferences=true
      - ApplyOutOfSyncOnly=true
      - SkipDryRunOnMissingResource=true
    managedNamespaceMetadata:
      labels:
        app.kubernetes.io/part-of: streamforge-application
        app.kubernetes.io/name: streamforge
  revisionHistoryLimit: 10
