apiVersion: alb.networking.azure.io/v1
kind: HealthCheckPolicy
metadata:
  name: frontend-health-check
  labels:
    app.kubernetes.io/part-of: streamforge-infra
    app.kubernetes.io/component: gateway
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  targetRef:
    group: ""
    kind: Service
    name: sf-frontend-svc
  default:
    interval: 5s
    timeout: 3s
    healthyThreshold: 2
    unhealthyThreshold: 3
    port: 3000 # Port number for Containers not the Service port number
    http:
      path: /api/health
      match:
        statusCodes:
          - start: 200
            end: 299
    useTLS: false
